<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>유튜잼 — 리듬 게임</title>
<link rel="icon" href="./assets/ui/yellow_star.png" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#0d0b1a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="유튜잼" />
<link rel="apple-touch-icon" href="./assets/icon-180.png" />
<style>
  @font-face { font-family: 'Galmuri'; src: url('./assets/fonts/Galmuri11.woff2') format('woff2'); }
  @font-face { font-family: 'GalmuriB'; src: url('./assets/fonts/Galmuri11-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'KFuture'; src: url('./assets/fonts/KenneyFutureNarrow.ttf') format('truetype'); }
  html, body { margin: 0; height: 100%; background: #0d0b1a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  /* 아이폰 노치·홈 막대를 피한 자리 (홈 화면 앱·가로 화면에서 중요) */
  #stage { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); overflow: hidden; }
  #wrap { position: absolute; left: 50%; top: 50%; width: 960px; height: 540px; transform-origin: 0 0; }
  canvas { display: block; width: 960px; height: 540px; image-rendering: auto; }
  #yt { position: absolute; left: 470px; top: 64px; width: 466px; height: 262px; border-radius: 8px; overflow: hidden; display: none; background: #000; box-shadow: 0 0 0 3px #2b2440; }
  #yt, #yt iframe { pointer-events: none; }
  #rotate { display: none; position: fixed; inset: 0; background: #0d0b1a; color: #ffd75a; font: 20px Galmuri, sans-serif; align-items: center; justify-content: center; text-align: center; line-height: 1.7; z-index: 9; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  #form { position: absolute; left: 24px; top: 56px; display: none; font-family: Galmuri, sans-serif; }
  #form input { font-family: Galmuri, sans-serif; font-size: 16px; padding: 8px 10px; border-radius: 6px; border: 2px solid #3b3460; background: #f3f1ff; width: 402px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="c" width="960" height="540"></canvas><div id="yt"></div><div id="form"><input id="url" placeholder="유튜브 주소를 붙여 넣고 Enter" /></div><input id="file" type="file" accept=".json,application/json" style="display:none" /></div></div>
<div id="rotate"><div>📱↻<br />휴대폰을 가로로 돌려 주세요</div></div>
<script type="module" src="./main.js"></script>
</body>
</html>

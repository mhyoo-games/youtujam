<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>유튜잼 — 리듬 게임</title>
<link rel="icon" href="./assets/ui/yellow_star.png" />
<style>
  @font-face { font-family: 'Galmuri'; src: url('./assets/fonts/Galmuri11.woff2') format('woff2'); }
  @font-face { font-family: 'GalmuriB'; src: url('./assets/fonts/Galmuri11-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'KFuture'; src: url('./assets/fonts/KenneyFutureNarrow.ttf') format('truetype'); }
  html, body { margin: 0; height: 100%; background: #0d0b1a; overflow: hidden; touch-action: none; }
  #wrap { position: absolute; left: 50%; top: 50%; width: 960px; height: 540px; transform-origin: 0 0; }
  canvas { display: block; width: 960px; height: 540px; image-rendering: auto; }
  #yt { position: absolute; left: 24px; top: 96px; width: 400px; height: 225px; border-radius: 8px; overflow: hidden; display: none; background: #000; box-shadow: 0 0 0 3px #2b2440; }
  #yt iframe { pointer-events: none; }
  #form { position: absolute; display: none; font-family: Galmuri, sans-serif; }
  #form input { font-family: Galmuri, sans-serif; font-size: 16px; padding: 8px 10px; border-radius: 6px; border: 2px solid #3b3460; background: #f3f1ff; width: 420px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas><div id="yt"></div><div id="form"><input id="url" placeholder="유튜브 주소를 붙여 넣으세요 (예: https://youtu.be/...)" /></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
